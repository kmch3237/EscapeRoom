<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/common :: headInner('No Exit - 예약')}"></th:block>
    <link rel="stylesheet" th:href="@{/dist/css/reservation.css}">

    <script src="https://code.jquery.com/jquery.min.js"></script>
    <script>
        $(function () {
            $("#resBtn").on("click", function () {
                const partyId = $(this).data("party-id");
                $.ajax({
                    url: "/reservation/action",
                    type: "POST",
                    data: { partyId: partyId },
                    success: function (res) {
                        alert(res.message);
                        if (res.success) {
                            location.href = "/mypage/reservations";
                        } else {
                            location.href = "/party/board/" + partyId;
                        }
                    },
                    error: function () {
                        alert('오류가 발생했습니다.');
                    }
                });
            });
        });
    </script>
</head>

<body>

<div th:replace="~{fragments/common :: header}"></div>

<main class="ne-main-content ne-body-offset">
    <div class="ne-container d-flex justify-content-between">

        <div class="col-md-8 ne-wrap">

            <div class="themeWrap content-box-yellow mb-2 d-flex align-items-center">
                <div class="icon">🔐</div>
                <div class="themeInfo">
                    <p class="cafeName" th:text="${bookerInfo.cafeName}">카페명</p>
                    <p class="themeName" th:text="${bookerInfo.roomName}">테마명</p>
                    <p class="reservDate" th:text="${bookerInfo.openAt}">예약날짜</p>
                </div>
            </div>

            <div class="reservWrap content-box mb-2">
                <div class="ne-title">예약자 정보</div>
                <form name="reservForm" method="post">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <label for="name" class="label">이름</label><br>
                            <input type="text" id="name" name="name" class="ne-box" readonly="readonly"
                                   th:value="${bookerInfo.bookerName}"/>
                        </div>
                        <div>
                            <label for="phone" class="label">연락처</label><br>
                            <input type="tel" id="phone" name="phone" class="ne-box" readonly="readonly"
                                   th:value="${bookerInfo.bookerTel}"/>
                        </div>
                    </div>
                    <div class="mb-2">
                        <p class="label">총 방문 인원</p>
                        <div class="d-flex justify-content-between align-items-center mt-1" style="width: 20%;">
                            <span class="personCount" th:text="${bookerInfo.totalMember}">0</span>
                            <span style="font-size: 14px; color: #666;">명</span>
                        </div>
                    </div>
                </form>
            </div>

            <div class="content-box reservInfo mb-3">
                <div class="ne-title">예약 안내사항</div>
                <ul>
                    <li>예약 확정 후 현장 결제로 진행됩니다.</li>
                    <li>예약 10분 전까지 도착해주세요.</li>
                    <li>예약 시간 24시간 이전까지만 예약 가능합니다.</li>
                </ul>
            </div>

            <div class="btnWrap">
                <button type="button" class="btn btn-primary" id="resBtn"
                        th:attr="data-party-id=${bookerInfo.partyId}">예약 확정하기</button>
            </div>
        </div>

        <div class="col-md-3 ne-wrap">
            <div class="payWrap content-box-yellow">
                <div class="ne-title mb-4">예약 정보</div>

                <div class="text-center mb-3">
                    <img src="" alt="테마이미지" style="height: 250px;"
                         th:src="@{${bookerInfo.roomImg}}"/>
                </div>

                <div class="d-flex justify-content-between mb-2">
                    예약 테마명
                    <span th:text="${bookerInfo.roomName}">테마명</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    예약 날짜
                    <span th:text="${bookerInfo.openAt}">날짜</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    1인 기준가
                    <span>
                        <span th:text="${#numbers.formatInteger(bookerInfo.price, 1, 'COMMA')}">0</span>
                        원
                    </span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    총 인원
                    <span th:text="|${bookerInfo.totalMember}명|">0명</span>
                </div>
                <div class="line"></div>
                <div class="d-flex justify-content-between total">
                    합계(현장결제)
                    <span>
                        <span th:text="${#numbers.formatInteger(bookerInfo.price * bookerInfo.totalMember, 1, 'COMMA')}">0</span>
                        원
                    </span>
                </div>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/common :: footer}"></div>

</body>
</html>
