<!DOCTYPE html>
<!-- attendanceHistory.jsp -> Thymeleaf. 사장 출석 기록 목록 + 상세 모달(AJAX) -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/common :: headInner('출석기록')}"></th:block>
    <link rel="stylesheet" th:href="@{/dist/css/attendance.css}">
    <style>
        .detail-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, .45); z-index: 1050; }
        .detail-modal { position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%); width: 420px; max-height: 70vh; overflow-y: auto; background: #fff; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 1.25rem 1.5rem; z-index: 1051; }
        .detail-modal .modal-title { font-weight: 700; font-size: 1.05rem; margin-bottom: .35rem; }
        .detail-modal .modal-sub { font-size: .82rem; color: #888; margin-bottom: .9rem; }
        .detail-modal .crew-row { display: flex; justify-content: space-between; align-items: center; padding: .5rem 0; border-bottom: 1px solid #eee; font-size: .9rem; }
        .detail-modal .crew-row:last-child { border-bottom: none; }
        .detail-modal .modal-close-wrap { text-align: right; margin-top: 1rem; }
    </style>
    <script src="https://code.jquery.com/jquery.min.js"></script>
    <script>
        // 상세 모달 열기 (JS 안이라 URL 절대경로)
        function openDetail(reservationId, title, sub) {
            $.ajax({
                type: "GET",
                url: "/owner/attendance/history/detail",
                data: { reservationId: reservationId },
                dataType: "json",
                success: function (data) {
                    if (data == null || data.length == 0) { alert("상세 기록이 없습니다."); return; }
                    $("#detailTitle").text(title);
                    $("#detailSub").text(sub);
                    let html = "";
                    data.forEach(function (crew) {
                        let status = crew.statusName;
                        let cls = (status == "노쇼") ? "status-noshow" : "status-done";
                        html += "<div class='crew-row'><span>" + crew.nickname + "</span>"
                              + "<span class='" + cls + "'>" + status + "</span></div>";
                    });
                    $("#detailBody").html(html);
                    $("#detailOverlay, #detailModal").show();
                },
                error: function (e) { alert("상세 조회 중 에러 발생"); console.log(e.responseText); }
            });
        }
        function closeDetail() { $("#detailOverlay, #detailModal").hide(); }
        $(function () { $("#detailOverlay").click(closeDetail); });
    </script>
</head>
<body>

<div th:replace="~{fragments/common :: header}"></div>

<div class="ne-main-content ne-body-offset">
    <div class="ne-container d-flex">
        <aside class="col-md-2">
            <div th:replace="~{fragments/sidebar :: ownerSide}"></div>
        </aside>
        <div class="col-md-10 resWrap">
            <div class="title">출석 기록</div>
            <div class="d-flex justify-content-between">
                <div class="resList" style="width:100%">
                    <div class="attend-list">

                        <div class="row fw-bold border-bottom py-2 m-0">
                            <div class="col-1">시간</div>
                            <div class="col-2">카페</div>
                            <div class="col-2">테마</div>
                            <div class="col-2">예약자</div>
                            <div class="col-1">인원</div>
                            <div class="col-2">노쇼</div>
                        </div>

                        <div th:each="r : ${historyList}" class="row align-items-center border-bottom py-2 m-0 text-muted">
                            <div class="col-1 fw-bold">
                                <span th:text="${#dates.format(r.openAt, 'MM-dd')}">01-01</span><br>
                                <span th:text="${#dates.format(r.openAt, 'HH:mm')}">00:00</span>
                            </div>
                            <div class="col-2" th:text="${r.cafeName}">카페</div>
                            <div class="col-2" th:text="${r.roomName}">테마</div>
                            <div class="col-2" th:text="${r.leaderNickname}">예약자</div>
                            <div class="col-1"><span th:text="${r.totalMember}">0</span>명</div>
                            <div class="col-2 d-flex justify-content-between align-items-center">
                                <span class="status-noshow"><span th:text="${r.noshowCount}">0</span>명</span>
                                <!-- onclick 안에 서버값 3개 전달: th:onclick + | | 리터럴 -->
                                <button type="button" class="btn btn-sm btn-outline-primary"
                                        th:onclick="|openDetail(${r.reservationId}, '${r.roomName}', '${#dates.format(r.openAt, 'MM-dd HH:mm')}  ${r.cafeName}')|">상세</button>
                            </div>
                        </div>

                        <div th:if="${#lists.isEmpty(historyList)}" class="text-center py-3">처리된 출석 기록이 없습니다.</div>
                    </div>

                    <div th:if="${dataCount != 0}" th:utext="${paging}"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 출석 상세 모달 -->
<div id="detailOverlay" class="detail-modal-overlay"></div>
<div id="detailModal" class="detail-modal" style="display:none;">
    <div class="modal-title" id="detailTitle"></div>
    <div class="modal-sub" id="detailSub"></div>
    <div id="detailBody"></div>
    <div class="modal-close-wrap">
        <button type="button" class="btn btn-sm btn-secondary" onclick="closeDetail()">닫기</button>
    </div>
</div>

<div th:replace="~{fragments/common :: footer}"></div>

</body>
</html>
