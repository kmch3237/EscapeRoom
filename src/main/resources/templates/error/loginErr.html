<!DOCTYPE html>
<!-- loginErr.jsp -> Thymeleaf. errorMsg alert 후 로그인 페이지로 -->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 오류</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>
    <script th:inline="javascript">
        /*<![CDATA[*/
        alert(/*[[${errorMsg}]]*/ '로그인이 필요합니다.');
        // @{} 로 contextPath 안전하게 조립
        window.location.href = /*[[@{/user/login}]]*/ '/user/login';
        /*]]>*/
    </script>
</body>
</html>
