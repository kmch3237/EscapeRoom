<!DOCTYPE html>
<!-- reservations.jsp -> Thymeleaf. 컨트롤러 MyReservationController.reservations 가 model 넘김 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- 공통 head 내용물 재사용 + 이 페이지 전용 CSS/JS -->
    <th:block th:replace="~{fragments/common :: headInner('No Exit - 마이페이지 예약현황')}"></th:block>
    <link rel="stylesheet" th:href="@{/dist/css/myReserv.css}">
    <script src="https://code.jquery.com/jquery.min.js"></script>
    <script th:src="@{/dist/js/reservations.js}"></script>
</head>

<body>

    <!-- 예약 취소 모달 (JS가 값 채움) -->
    <div class="modal fade" id="cancelModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">예약 취소</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p><span class="text-muted">카페</span> &nbsp; <strong id="modal-cafe-name"></strong></p>
                    <p><span class="text-muted">테마</span> &nbsp; <strong id="modal-room-name"></strong></p>
                    <p><span class="text-muted">일시</span> &nbsp; <strong id="modal-open-at"></strong></p>
                    <p><span class="text-muted">인원</span> &nbsp; <strong id="modal-total-member"></strong>명</p>
                    <div class="mt-3" style="color:#e53935; font-size:13px;">
                        취소 후 복구가 불가합니다. 정말 취소하시겠습니까?
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">닫기</button>
                    <button type="button" class="btn ne-btn-deact" id="modalConfirmBtn">예약 취소</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 공통 헤더 -->
    <div th:replace="~{fragments/common :: header}"></div>

    <main class="ne-main-content">
        <div class="ne-container d-flex justify-content-between" style="margin: 30px auto;">

            <!-- 왼쪽 사이드바 (현재 메뉴 = reservations 를 파라미터로 알려줌) -->
            <aside>
                <div th:replace="~{fragments/sidebar :: leftSidebar('reservations')}"></div>
            </aside>

            <!-- 가운데: 예약현황 -->
            <div class="ne-card resListWrap" style="width: 55%; margin: 0 20px;">
                <div class="title ne-sc-title">예약현황</div>

                <!-- 탭 3개 (현재 탭만 'on') -->
                <div class="tabWrap d-flex">
                    <a th:href="@{/mypage/reservations(tab=1, page=1)}" class="tab" th:classappend="${tab == 1} ? 'on'">
                        예약 중 <span th:text="${bookedCount}">0</span></a>
                    <a th:href="@{/mypage/reservations(tab=2, page=1)}" class="tab" th:classappend="${tab == 2} ? 'on'">
                        플레이 완료</a>
                    <a th:href="@{/mypage/reservations(tab=3, page=1)}" class="tab" th:classappend="${tab == 3} ? 'on'">
                        예약 취소</a>
                </div>

                <div class="listWrap">

                    <!-- 탭1: 예약 중 -->
                    <div class="booked" th:if="${tab == 1}">
                        <div th:each="dto : ${list}" class="ne-card ne-card-accent d-flex justify-content-between align-items-center">
                            <div>
                                <div>
                                    <a th:href="@{/theme/info/{id}(id=${dto.roomId})}" class="theme" th:text="${dto.roomName}">테마</a>
                                    <span class="ne-st ne-st-sm ne-st-blue">예약 완료</span>
                                </div>
                                <div style="color: #666; font-size: 14px;">
                                    <span th:text="${dto.cafeName}">카페</span>
                                    <span class="reservDate" th:text="${dto.openAt}">일시</span>
                                </div>
                                <div>예약인원 <span th:text="${dto.totalMember}">0</span>명</div>
                            </div>
                            <!-- 파티장만 취소 버튼 -->
                            <div class="btnWrap" th:if="${dto.partyRole == '파티장'}">
                                <button type="button" class="btn ne-btn-deact cancelBtn"
                                        th:attr="data-reservation-id=${dto.reservationId},
                                                 data-cafe-name=${dto.cafeName},
                                                 data-room-name=${dto.roomName},
                                                 data-open-at=${dto.openAt},
                                                 data-total-member=${dto.totalMember},
                                                 data-party-name=${dto.partyName},
                                                 data-party-id=${dto.partyId}">예약 취소</button>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(list)}" class="text-center">예약 중인 내역이 없습니다.</div>
                    </div>

                    <!-- 탭2: 플레이 완료 -->
                    <div class="done" th:if="${tab == 2}">
                        <div th:each="dto : ${list}" class="ne-card ne-card-accent d-flex justify-content-between align-items-center">
                            <div>
                                <div>
                                    <a th:href="@{/theme/info/{id}(id=${dto.roomId})}" class="theme" th:text="${dto.roomName}">테마</a>
                                    <span class="ne-st ne-st-sm"
                                          th:classappend="${dto.attendStatus == '출석 완료' ? 'ne-st-green' : (dto.attendStatus == '노쇼' ? 'ne-st-red' : 'ne-st-amber')}"
                                          th:text="${dto.attendStatus}">상태</span>
                                </div>
                                <div style="color: #666; font-size: 14px;">
                                    <span th:text="${dto.cafeName}">카페</span>
                                    <span class="reservDate" th:text="${dto.openAt}">일시</span>
                                </div>
                            </div>
                            <div class="btnWrap" th:if="${dto.attendStatus == '출석 완료'}">
                                <button type="button" class="btn btn-primary" onclick="location.href='/mypage/record'">기록 등록</button>
                            </div>
                            <div class="btnWrap" th:if="${dto.attendStatus == '출석 미등록'}">
                                <div class="ne-tooltip" th:attr="data-tooltip=|매장 누락 건입니다. 해당 카페(${dto.cafeTel})로 문의해 주세요.|">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-question-circle" viewBox="0 0 16 16">
                                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                        <path d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286m1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94"/>
                                    </svg>
                                </div>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(list)}" class="text-center">플레이 완료된 내역이 없습니다.</div>
                    </div>

                    <!-- 탭3: 예약 취소 -->
                    <div class="canceled" th:if="${tab == 3}">
                        <div th:each="dto : ${list}" class="ne-card ne-card-accent d-flex justify-content-between align-items-center">
                            <div>
                                <div>
                                    <a th:href="@{/theme/info/{id}(id=${dto.roomId})}" class="theme" th:text="${dto.roomName}">테마</a>
                                    <span class="ne-st ne-st-sm ne-st-red" th:text="${dto.cancelType}">취소유형</span>
                                </div>
                                <div style="color: #666; font-size: 14px;">
                                    <span th:text="${dto.cafeName}">카페</span>
                                    <span class="reservDate" th:text="${dto.openAt}">일시</span>
                                </div>
                                <div style="font-size: 14px; color: #666;">
                                    취소일: <span th:text="${dto.canceledAt}">일자</span>
                                </div>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(list)}" class="text-center">취소된 내역이 없습니다.</div>
                    </div>

                    <!-- 공통 페이징 (탭 무관: tab 파라미터로 링크 구성) : 자바가 준 숫자로 th:each 가 그림 -->
                    <div class="paginate" th:if="${totalPage > 0}">
                        <!-- 처음/이전 블록 : 현재 블록이 1블록이 아닐 때만 -->
                        <a th:if="${startPage > 1}" th:href="@{/mypage/reservations(tab=${tab}, page=1)}" title="처음">&laquo;</a>
                        <a th:if="${startPage > 1}" th:href="@{/mypage/reservations(tab=${tab}, page=${startPage - 1})}" title="이전">&lt;</a>

                        <!-- 페이지 번호 : startPage ~ endPage -->
                        <th:block th:each="i : ${#numbers.sequence(startPage, endPage)}">
                            <span th:if="${i == currentPage}" class="active" th:text="${i}">1</span>
                            <a th:unless="${i == currentPage}" th:href="@{/mypage/reservations(tab=${tab}, page=${i})}" th:text="${i}">1</a>
                        </th:block>

                        <!-- 다음/마지막 블록 : 마지막 블록이 아닐 때만 -->
                        <a th:if="${endPage < totalPage}" th:href="@{/mypage/reservations(tab=${tab}, page=${endPage + 1})}" title="다음">&gt;</a>
                        <a th:if="${endPage < totalPage}" th:href="@{/mypage/reservations(tab=${tab}, page=${totalPage})}" title="마지막">&raquo;</a>
                    </div>

                </div>
            </div>

            <!-- 오른쪽 사이드바 (예약 캘린더 + 매너온도) -->
            <aside class="d-flex justify-content-end" style="width: 25%;">
                <div th:replace="~{fragments/sidebar :: rightSidebar}"></div>
            </aside>

        </div>
    </main>

    <!-- 공통 푸터 -->
    <div th:replace="~{fragments/common :: footer}"></div>

</body>
</html>
